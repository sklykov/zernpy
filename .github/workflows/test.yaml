name: Run Python tests

on:
  workflow_call:
  pull_request:  # automatic runs only for PRs to main that change the files listed below
    # Direct pushes to main are not tested; fine if 'main' is updated only via PRs
    branches: [ main ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/test.yaml'
  workflow_dispatch:  # adds "Run workflow" button in the Actions tab (once this file is on main)

jobs:
  test:
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: ["3.8", "3.11", "3.13"]

    steps:
      - name: Checkout code  # loads code from a repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .
          pip install "numba>=0.57.1"

      - name: Run tests
        run: pytest
